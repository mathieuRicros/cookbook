# Blueprint Render : déploie l'API (Docker) sur l'offre gratuite.
# Le front est un Static Site Render créé à la main, la base est sur Neon
# (voir README, section Déploiement).

services:
  - type: web
    name: cookbook-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # À renseigner dans le tableau de bord Render (jamais dans git)
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
